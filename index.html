<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIANG CHEN | Visual Planner</title>
    <!-- 引入思源宋体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ================= 基础视觉规范 ================= */
        :root {
            --bg-color: #f4f4f2;
            --text-black: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-black);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            cursor: crosshair;
            -webkit-font-smoothing: antialiased;
        }

        /* 参考 032c 的紧凑纯黑中文排版 */
        .zh-editorial {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            line-height: 1.6;
            letter-spacing: 0.01em;
            color: #000000;
            font-weight: 400;
        }

        /* 中文段落中混排的加粗英文 */
        .en-inline {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: -0.01em;
            color: #000000;
        }

        /* ================= 顶部导航栏 ================= */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.8rem 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(244,244,242,0.92), rgba(244,244,242,0));
        }

        .nav-logo {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #000000;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .nav-links a {
            color: #000000;
            text-decoration: none;
            text-transform: uppercase;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.45;
        }

        /* ================= 首屏大标题 (液态金属交互) ================= */
        .hero {
            padding: 16vh 3.5rem 6vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-size: 11.5vw;
            font-weight: 900;
            letter-spacing: -0.045em;
            line-height: 0.85;
            text-transform: uppercase;
            color: #000000;
            user-select: none;
            transition: transform 0.35s ease, filter 0.35s ease;
            position: relative;
        }

        /* 悬停时的液态镍金属质感 */
        .hero-title:hover {
            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #d8d8dc 16%,
                #4a4a52 38%,
                #0a0a0c 49%,
                #b8b8c2 55%,
                #ffffff 74%,
                #3a3a42 90%,
                #000000 100%
            );
            background-size: 100% 220%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* 叠加 SVG 液态扭曲 + 金属投影 */
            filter: url(#liquid-metal) drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.28));
            animation: chromeFlow 2.2s ease-in-out infinite alternate;
            transform: scale(1.015);
        }

        @keyframes chromeFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        /* ================= 首页个人照片与信息区 ================= */
        .profile-section {
            max-width: 920px;
            margin: 5rem auto 7rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 3.5rem;
            align-items: start;
        }

        .profile-photo-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #e2e2df;
            position: relative;
            overflow: hidden;
        }

        .profile-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.4s ease;
        }

        .profile-photo-box img:hover {
            filter: contrast(112%) grayscale(20%);
        }

        /* 没传照片时的极简占位提示 */
        .photo-caption {
            margin-top: 0.6rem;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #000000;
            display: flex;
            justify-content: space-between;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .profile-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid #000000;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .profile-en {
            font-size: 12px;
            line-height: 1.48;
            color: #000000;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        .profile-contact {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .profile-contact a {
            color: #000000;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        .profile-contact a:hover {
            border-bottom: 1px solid #000000;
        }

        /* ================= 瀑布流作品预览区 ================= */
        .gallery-container {
            padding: 2rem 3.5rem 8rem;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }

        .img-placeholder {
            background: #e2e2df;
            transition: filter 0.3s ease;
        }

        .img-placeholder:hover {
            filter: contrast(115%) saturate(0.8);
        }

        .item-1 { grid-column: 2 / 7; height: 560px; }
        .item-2 { grid-column: 8 / 12; height: 340px; margin-top: 90px; }
